name: bridge-tests
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install mcp==1.30.0 pytest==9.1.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: vendor/codex-with-chatgpt
      - run: npm run build && npm test
        working-directory: vendor/codex-with-chatgpt
      - run: python -m pytest -q
      - run: python scripts/release.py --output release
